<div class="startline"></div>
<!-- The championships across the top, the pages of one of them underneath: the
     first choice is which championship, and everything else is a view of it. -->
<div class="topbar" id="topbar">
  <nav class="appbar" aria-label="Championship"><div class="wrap">
    <div class="yearbar" id="yearBar" hidden aria-label="Season"></div>
    <div class="seriesbar" id="seriesBar"></div>
  </div></nav>
  <header class="mast">
    <nav class="tabs wrap" id="tabs" role="tablist"></nav>
    <!-- The same row, when Live is chosen instead of a championship: the
         meetings that are running or coming, rather than the pages of one
         series. Only one of the two is ever shown. -->
    <nav class="tabs wrap" id="liveEvents" role="tablist" aria-label="Live meetings" hidden></nav>
  </header>
</div>
<button class="seriesfab" id="seriesFab" type="button" aria-expanded="false"
        aria-controls="seriesBar"><span class="bars"></span><span
        class="now" id="seriesFabNow"></span></button>
<!-- The other corner: what is on right now, from anywhere on the page. On a
     wide screen the same choice is the last button of the championship strip,
     and this button does not exist. -->
<button class="livefab" id="liveFab" type="button" aria-pressed="false"
        aria-controls="p-liveevent">Live</button>

<main class="wrap">
  <section class="panel on" id="p-about"></section>
  <section class="panel" id="p-standings"></section>
  <section class="panel" id="p-live"></section>
  <section class="panel" id="p-radar"></section>
  <section class="panel" id="p-races"></section>
  <section class="panel" id="p-qualifying"></section>
  <section class="panel" id="p-enduro"></section>
  <section class="panel" id="p-calendar"></section>
  <section class="panel" id="p-runin"></section>
  <section class="panel" id="p-rules"></section>
  <section class="panel" id="p-socials"></section>
  <section class="panel" id="p-faq"></section>
  <!-- One meeting, whatever is on at it: the stream, the timetable, and the
       timing of the session running, scored for whichever championship's
       session it is. Shown instead of the tabs' panels while Live is chosen. -->
  <section class="panel" id="p-liveevent"></section>
</main>

<footer class="wrap">
  <p>Results from <a href="https://www.tsl-timing.com/">TSL Timing</a>,

  regulations. Provisional until declared final by the organisers.</p>
</footer>

<script>
(function () {
  var parts = decodeURIComponent((location.hash || '').slice(1))
    .split('/').filter(Boolean);
  var year = ALL.season;
  if (/^\d{4}$/.test(parts[0])
      && ALL.seasons.some(function (s) { return s.year === +parts[0]; })) {
    year = +parts.shift();
  }
  // A live address names a meeting, and which championships race at it is a
  // question for the script. Guessing one here would fetch a championship
  // that is very likely not at that meeting at all.
  if (parts[0] === 'live') return;
  var season = ALL.seasons.filter(function (s) { return s.year === year; })[0]
    || ALL.seasons[0];
  var want = year + '/' + parts[0];
  if (!SERIES_FILES[want]) want = season.year + '/' + season.series[0].key;
  if (SERIES_FILES[want]) {
    document.write('<script src="' + SERIES_FILES[want] + '"><\/script>');
  }
})();
</script>
