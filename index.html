<style>
:root{
  --paper:#F1F3F0; --surface:#FFFFFF; --surface-2:#E8ECE7; --sunk:#E2E8E3;
  --ink:#111C18; --ink-2:#3B4C45; --ink-3:#54655E;
  --line:#D3DAD5; --line-2:#BDC7C0;
  --racing:#0F5738; --racing-ink:#0F5738; --racing-soft:#DCE9E1;
  --band:#0F5738; --band-ink:#FFFFFF; --band-off:#5B6C65; --band-off-ink:#FFFFFF;
  --tip-bg:#FFFFFF; --tip-ink:#3B4C45; --tip-strong:#111C18; --tip-line:#BDC7C0;
  --flag:#E0AE00; --flag-soft:#F8ECC4; --flag-ink:#7A5E00;
  --fl:#6B2FA0;
  --alarm:#AE3220; --alarm-soft:#F6DED9;
  --s1:#117A56; --s2:#2F5CD6; --s3:#D24118; --s4:#8A46C4; --s5:#A98400; --s6:#0089A8;
  --grid:#DFE5E0;
  --shadow:0 1px 2px rgba(17,28,24,.06), 0 8px 24px -12px rgba(17,28,24,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1512; --surface:#16211D; --surface-2:#1D2925; --sunk:#111B17;
    --ink:#E9EFEB; --ink-2:#AFBEB7; --ink-3:#8D9D96;
    --line:#28352F; --line-2:#35453E;
    --racing:#4FBF8B; --racing-ink:#7FD3AB; --racing-soft:#183026;
    --band:#1E4535; --band-ink:#D6EBE0; --band-off:#2A3A34; --band-off-ink:#B4C3BC;
  --tip-bg:#24312C; --tip-ink:#C6D3CD; --tip-strong:#FFFFFF; --tip-line:#3B4C45; --band-off:#2A3A34; --band-off-ink:#B4C3BC;
    --tip-bg:#24312C; --tip-ink:#C6D3CD; --tip-strong:#FFFFFF; --tip-line:#3B4C45;
    --flag:#E5B93B; --flag-soft:#38300F; --flag-ink:#F0CE68;
  --fl:#C2A0EA;
    --fl:#C2A0EA;
    --alarm:#E4795E; --alarm-soft:#3A1E17;
    --s1:#2A9C74; --s2:#6E8FE0; --s3:#E0603A; --s4:#A874D8; --s5:#B08F1C; --s6:#1FA4BE;
    --grid:#243029;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1512; --surface:#16211D; --surface-2:#1D2925; --sunk:#111B17;
  --ink:#E9EFEB; --ink-2:#AFBEB7; --ink-3:#8D9D96;
  --line:#28352F; --line-2:#35453E;
  --racing:#4FBF8B; --racing-ink:#7FD3AB; --racing-soft:#183026;
  --band:#1E4535; --band-ink:#D6EBE0;
  --flag:#E5B93B; --flag-soft:#38300F; --flag-ink:#F0CE68;
  --alarm:#E4795E; --alarm-soft:#3A1E17;
  --s1:#2A9C74; --s2:#6E8FE0; --s3:#E0603A; --s4:#A874D8; --s5:#B08F1C; --s6:#1FA4BE;
  --grid:#243029;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.mono,td.num,th.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--racing-ink)}
:focus-visible{outline:2px solid var(--racing); outline-offset:2px; border-radius:3px}

.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}

/* ---- masthead ---------------------------------------------------------- */
.startline{height:6px;background:
  repeating-linear-gradient(90deg,var(--racing) 0 14px,transparent 14px 28px);}
header.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;padding:22px 0 16px}
.eyebrow{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;font-size:13px;color:var(--racing-ink);margin:0 0 2px}
h1{margin:0;font-size:clamp(30px,4.4vw,46px);line-height:.98;text-transform:uppercase}
h1 em{font-style:normal;color:var(--racing-ink)}
.mast-stats{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.stat{min-width:88px}
.stat .k{font-family:"Barlow Condensed",Arial,sans-serif;font-size:12px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:400}

nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface)}
nav.tabs button{
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:17px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding:12px 16px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--racing)}

main{padding:26px 0 64px}
.panel{display:none}
.panel.on{display:block}
.lede{color:var(--ink-2);max-width:66ch;margin:0 0 18px}
h2{font-size:23px;margin:34px 0 10px;text-transform:uppercase;letter-spacing:.03em}
h2:first-child{margin-top:0}
.sub{font-size:13px;color:var(--ink-3);margin:-6px 0 14px}

/* ---- tables ------------------------------------------------------------ */
.scroller{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:4px;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surface-2);position:sticky;top:0;z-index:3;
  font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
thead tr.band th{background:var(--band);color:var(--band-ink);text-align:center;font-size:11.5px;
  letter-spacing:.1em;border-bottom:1px solid var(--band);top:0;z-index:4}
thead tr.band th.future{background:var(--band-off);color:var(--band-off-ink)}
thead tr.band th.stick1,thead tr.band th.stick2{background:var(--surface-2);color:var(--ink-2)}
thead tr.cols th{top:26px;z-index:3}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:center}

/* sticky driver identity columns */
.stick1{position:sticky;left:0;z-index:2;background:var(--surface);width:44px}
.stick2{position:sticky;left:44px;z-index:2;background:var(--surface);min-width:150px}
thead .stick1,thead .stick2{z-index:5;background:var(--surface-2)}
tbody tr:hover .stick1,tbody tr:hover .stick2{background:var(--surface-2)}
.stick2{border-right:1px solid var(--line-2)}
thead .stick2{border-right:1px solid var(--line-2)}

td.pt{text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  cursor:default}
/* the championship grid is 21 rounds wide, so it gets its own tighter metrics */
table.champ th,table.champ td{padding:5px 3px}
table.champ .stick1{width:28px;padding-left:2px;padding-right:2px}
table.champ .stick2{width:146px;min-width:146px;left:28px;padding-left:6px}
table.champ td.pt,table.champ tr.cols th{width:27px;min-width:27px}
table.champ td.tot,table.champ td.num{width:36px}
table.champ .chip{font-size:10px;padding:0 4px;letter-spacing:.06em}
table.champ .rowhead{gap:5px}
table.champ .rowhead b{overflow:hidden;text-overflow:ellipsis}
table.champ thead tr.cols th{font-size:11px;letter-spacing:.02em}
td.pt.win{background:var(--flag-soft);color:var(--flag-ink);font-weight:600}
td.pt.fl{text-decoration:underline;text-decoration-color:var(--fl);
  text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
td.pt.pod{background:var(--racing-soft)}
td.pt.pen{color:var(--alarm);font-weight:600;background:var(--alarm-soft)}
td.pt.none{color:var(--ink-3)}
td.pt.future{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--sunk) 5px 10px)}
td.tot{text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;background:var(--sunk)}
tr.guest td{color:var(--ink-3);font-style:italic}
tr.guest .stick2{font-style:italic}
.rowhead{display:flex;align-items:baseline;gap:7px}
.rowhead b{font-weight:600}
.chip{font-family:"Barlow Condensed",Arial,sans-serif;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid var(--line-2);
  color:var(--ink-3)}
.chip.pro{border-color:var(--racing);color:var(--racing-ink)}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0 0;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:13px;height:13px;border-radius:2px;border:1px solid var(--line-2);display:inline-block}

/* ---- chart ------------------------------------------------------------- */
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);padding:16px 16px 8px;margin-top:14px}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.ax{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--ink-3)}
.gl{stroke:var(--grid);stroke-width:1}
.serieslab{font-family:"Barlow Condensed",Arial,sans-serif;font-size:12.5px;font-weight:600}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ---- candles ----------------------------------------------------------- */
.candlebox{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);padding:14px 6px 8px;overflow-x:auto}
.candlebox svg{display:block}
.candlebox text.xlab{font-family:"Barlow Condensed",Arial,sans-serif;font-size:12px;fill:var(--ink-2)}
.candlebox text.xlab.out{fill:var(--ink-3)}
.refline{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4}
.reftext{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--ink-3)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:11px 14px;box-shadow:var(--shadow)}
.kpi .k{font-family:"Barlow Condensed",Arial,sans-serif;font-size:12px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12.5px;color:var(--ink-2)}
details.tv{margin-top:14px}
details.tv summary{cursor:pointer;font-family:"Barlow Condensed",Arial,sans-serif;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  padding:6px 0}
details.tv summary:hover{color:var(--ink)}
tr.outrow td{color:var(--ink-3)}

/* ---- cards ------------------------------------------------------------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);overflow:hidden}
.card.future{opacity:.9;border-style:dashed}
.card-h{display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:var(--band);color:var(--band-ink)}
.card.future .card-h{background:var(--band-off);color:var(--band-off-ink)}
.card-h .rnd{font-family:"IBM Plex Mono",monospace;font-size:12px;opacity:.85}
.card-h h3{margin:0;font-size:19px;text-transform:uppercase;letter-spacing:.03em;color:inherit}
.card-h .when{margin-left:auto;font-size:12.5px;opacity:.9;font-family:"IBM Plex Mono",monospace}
.card-b{padding:10px 14px 14px}
.ses{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;font-size:13px;align-items:baseline}
.ses .t{font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
.ses .n{color:var(--ink)}
.ses .r{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right}
.meta{margin-top:10px;font-size:12.5px;color:var(--ink-3);border-top:1px dotted var(--line-2);padding-top:8px}
.meta a{color:var(--racing-ink)}

/* ---- race picker ------------------------------------------------------- */
.picker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.picker button{appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line-2);
  color:var(--ink-2);border-radius:3px;padding:5px 10px;font-size:13px;
  font-family:"IBM Plex Mono",monospace}
.picker button:hover{border-color:var(--racing);color:var(--ink)}
.picker button[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.racehead{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-bottom:10px}
.racehead h3{margin:0;font-size:22px;text-transform:uppercase}
.racehead .f{font-size:13px;color:var(--ink-2)}
.racehead .f b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.notes{margin:12px 0 0;padding:10px 13px;background:var(--surface-2);border-left:3px solid var(--flag);
  font-size:12.5px;color:var(--ink-2);border-radius:0 3px 3px 0}
.notes p{margin:0 0 4px}
.notes p:last-child{margin:0}
tr.dnf td{color:var(--ink-3)}
tr.win td{background:var(--flag-soft)}
tr.win:hover td{background:var(--flag-soft)}

/* ---- rules ------------------------------------------------------------- */
.cols2{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.prose p{margin:0 0 12px;color:var(--ink-2);max-width:62ch}
.prose h3{margin:20px 0 6px;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.prose h3:first-child{margin-top:0}
.prose ul{margin:0 0 12px;padding-left:18px;color:var(--ink-2);max-width:62ch}
.prose li{margin-bottom:5px}
.reg{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--racing-ink);
  background:var(--racing-soft);padding:1px 5px;border-radius:2px;
  text-decoration:none;border-bottom:1px solid transparent;white-space:nowrap}
a.reg:hover,a.reg:focus-visible{border-bottom-color:var(--racing);background:var(--surface-2)}
.doclink{display:inline-flex;align-items:baseline;gap:8px;margin:0 0 16px;
  padding:9px 13px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--racing);border-radius:0 3px 3px 0;box-shadow:var(--shadow);
  font-size:13.5px;text-decoration:none;color:var(--ink)}
.doclink:hover{border-left-color:var(--flag)}
.doclink b{font-weight:600}
.doclink span{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px}

/* ---- tooltip ----------------------------------------------------------- */
#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--tip-bg);color:var(--tip-ink);border:1px solid var(--tip-line);
  font-size:12.5px;line-height:1.45;
  padding:7px 10px;border-radius:3px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tip b{color:var(--tip-strong)}
#tip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--ink-3);font-size:12.5px}
footer a{color:var(--racing-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="startline"></div>
<header class="mast">
  <div class="wrap mast-in">
    <div>
      <p class="eyebrow">BARC · Season 2026 · 21 races, 7 rounds</p>
      <h1>MOTUL Caterham<br><em>Seven Championship UK</em></h1>

    <div class="mast-stats" id="mastStats"></div>
  </div>

</header>

<main class="wrap">
  <section class="panel on" id="p-standings"></section>
  <section class="panel" id="p-races"></section>
  <section class="panel" id="p-calendar"></section>
  <section class="panel" id="p-runin"></section>
  <section class="panel" id="p-rules"></section>
</main>

<footer class="wrap">
  <p>Results from <a href="https://www.tsl-timing.com/">TSL Timing</a> and

</footer>

const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c;
  if (txt != null) e.textContent = txt; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const SERIES = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];
const REGS_URL = 'https://caterhamcars.com/assets/Documents/Seven%20Championship%20Documents/'
  + '2026%20Caterham%20Seven%20Championship%20UK%20Regulations%20-%20Published.pdf';
// page in that PDF for each article cited on this page
const REG_PAGE = { '1.3.5': 4, '1.3.6': 4, '1.5': 4, '1.6.1': 5, '1.6.2': 6,
                   '1.6.3': 6, '1.6.4': 6, '1.6.5': 7, '1.7.3': 7, '4.2.3': 15 };
const regHref = n => REGS_URL + (REG_PAGE[n] ? `#page=${REG_PAGE[n]}` : '');

/** Turn every `<span class="reg">1.6.1</span>` into a link to that article. */
function linkRegs(root) {
  root.querySelectorAll('span.reg').forEach(el => {
    const n = el.textContent.trim();
    const a = document.createElement('a');
    a.className = 'reg';
    a.href = regHref(n);
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = `2026 Championship Regulations, regulation ${n}`
      + (REG_PAGE[n] ? ` (page ${REG_PAGE[n]})` : '');
    a.textContent = n;
    el.replaceWith(a);
  });
}
const runSet = new Set(D.roundsRun);
const scoring = D.table.filter(t => t.registered);
const eventOf = {}; D.events.forEach(e => e.rounds.forEach(r => eventOf[r] = e));
const raceOf = {}; D.races.forEach(r => raceOf[r.round] = r);

/* ------------------------------------------------------------- tooltip */
const tip = $('#tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, x - w / 2), innerWidth - w - 8) + 'px';
  tip.style.top = (y - h - 12 < 8 ? y + 18 : y - h - 12) + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (t) { const r = t.getBoundingClientRect(); showTip(t.dataset.tip, r.left + r.width / 2, r.top); }
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
addEventListener('scroll', hideTip, true);

/* ----------------------------------------------------------- masthead */
(function mast() {
  const leader = scoring[0];
  const done = D.roundsRun.length, next = D.events.find(e => !e.source);
  const cells = [
    ['Races run', `${done}<small>/${D.roundsTotal}</small>`],
    ['Championship leader', `${esc(leader.driver.split(' ').pop().toUpperCase())} <small>#${leader.no}</small>`],
    ['Leading total', `${leader.gross}<small> pts</small>`],
    ['Registered', `${D.registrations}<small> drivers</small>`],
    ['Next round', next ? `<small>${esc(next.name)}</small>` : '<small>Season complete</small>'],
  ];
  $('#mastStats').innerHTML = cells.map(([k, v]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
})();

const TABS = [['standings', 'Standings'], ['races', 'Races'],
              ['runin', 'Title run-in'], ['calendar', 'Calendar & timings'],
              ['rules', 'How points work']];
const tabsEl = $('#tabs');
TABS.forEach(([id, label], i) => {
  const b = el('button', null, label);
  b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === 0);
  b.setAttribute('aria-controls', 'p-' + id);
  b.onclick = () => {
    [...tabsEl.children].forEach(x => x.setAttribute('aria-selected', x === b));
    TABS.forEach(([t]) => $('#p-' + t).classList.toggle('on', t === id));
    hideTip();
  };
  tabsEl.append(b);
});

/* ---------------------------------------------------------- standings */
function cellTip(t, rd) {
  const sc = t.rounds[rd], ev = eventOf[rd];
  const where = `<b>Round ${rd}</b> · ${esc(ev.name)}`;
  if (!runSet.has(Number(rd))) return `${where}<br>Not yet run`;
  if (!sc) return `${where}<br>${esc(t.driver)} did not enter`;
  const bits = [];
  if (sc.status === 'classified') {
    bits.push(`Finished <b>P${sc.pos}</b>`);
    if (sc.scoring_place && sc.scoring_place !== sc.pos)
      bits.push(`scores as P${sc.scoring_place} — guest entries are invisible for points`);
    bits.push(`${sc.race_points} race points`);
  } else bits.push(sc.status === 'DQ' ? 'Disqualified' : sc.status);
  if (sc.fl) bits.push('+1 fastest lap');
  if (sc.penalty) bits.push(`<b>${sc.penalty}</b> championship penalty from this round `
    + `(reg 4.2.3) — taken off the season total, not off these race points`);
  if (!t.registered) bits.push('Guest entry — scores no points');
  return `${where}<br>${esc(t.driver)}: ${bits.join('<br>')}`;
}

/** Tooltip for the Pen column: every deduction the driver has taken. */
function penTip(t) {
  const rows = D.penalties.filter(p => p.driver === t.driver)
    .map(p => `Round ${p.round}: <b>−${p.deduction}</b> (${p.licence_points} licence points)`);
  return `<b>${esc(t.driver)}</b> — championship penalties, reg 4.2.3<br>${rows.join('<br>')}`
    + `<br>Total <b>${t.penalty_points}</b>, deducted from the season total. `
    + `A penalty is not part of a round score, so a drop score cannot cancel it.`;
}

function standings() {
  const p = $('#p-standings'); p.innerHTML = '';
  p.append(Object.assign(el('p', 'lede'),
    { textContent: `Points scored in every race. An underlined score took the fastest lap of that `
      + `race, worth the extra point inside the number. A round marked in `
      + `red carried a championship penalty, but the points the driver earned on track are left `
      + `whole - the deduction is collected in the Pen column and taken off the total. `
      + `${D.roundsRun.length} of ${D.roundsTotal} races have been run; the remaining columns are `
      + `hatched. Hover any cell for the finishing position behind the number.` }));

  const sc = el('div', 'scroller'), tb = el('table', 'champ');
  const thead = el('thead');

  const band = el('tr', 'band');
  band.append(Object.assign(el('th', 'stick1'), { rowSpan: 2 }));
  band.append(Object.assign(el('th', 'stick2'), { rowSpan: 2, textContent: 'Driver' }));
  D.events.forEach(e => {
    const th = el('th', e.source ? '' : 'future', e.name);
    th.colSpan = e.rounds.length; th.title = e.dates;
    band.append(th);
  });
  ['Pen', 'Total', 'Drops', 'Net', 'W', 'FL'].forEach(h => {

  });
  thead.append(band);

  const cols = el('tr', 'cols');

  thead.append(cols);

  const tbody = el('tbody');
  D.table.forEach(t => {
    const tr = el('tr', t.registered ? '' : 'guest');

    const nm = el('td', 'stick2');
    // only an unregistered entry is a guest; a registered driver with no class

      else if (!s) { td.textContent = '·'; td.classList.add('none'); }
      else {
        // race points plus the fastest lap point - a penalty is never netted off
        // here, it goes in the Pen column
        td.textContent = (s.status === 'classified' || s.score !== 0)
          ? s.score : s.status.toLowerCase();
        if (s.status !== 'classified') td.style.fontSize = '11px';
        if (s.fl) td.classList.add('fl');
        if (s.scoring_place === 1) td.classList.add('win');
        if (s.penalty) td.classList.add('pen');
        if (s.status !== 'classified' && !s.penalty) td.classList.add('none');
      }
      td.dataset.tip = cellTip(t, key);
      tr.append(td);
    }
    const drops = t.dropped.reduce((a, b) => a + b, 0);
    const pen = el('td', 'num', t.penalty_points ? String(t.penalty_points) : '—');
    if (t.penalty_points) {
      pen.style.color = 'var(--alarm)';
      pen.style.fontWeight = 600;
      pen.dataset.tip = penTip(t);
    } else {
      pen.style.color = 'var(--ink-3)';
    }
    tr.append(pen);
    [[t.gross, 'tot'], [drops, 'num'], [t.net, 'num'], [t.wins, 'num'], [t.fastest_laps, 'num']]
      .forEach(([v, c]) => tr.append(el('td', c, String(v))));
    tbody.append(tr);
  });
  tb.append(tbody); sc.append(tb); p.append(sc);

  const lg = el('div', 'legend');
  lg.innerHTML =
    '<span><b class="mono" style="text-decoration:underline;text-decoration-color:var(--fl);'
    + 'text-decoration-thickness:2px;text-underline-offset:3px">24</b>'
    + 'Fastest lap of the race (+1 point)</span>'
    + [['var(--flag-soft)', 'Race win'],
       ['var(--alarm-soft)', 'Round carrying a championship penalty (deducted in Pen)'],
       ['var(--sunk)', 'Round not yet run']]

    + '<span><i class="sw" style="background:var(--surface)"></i>· = did not enter</span>';
  p.append(lg);

  p.append(Object.assign(el('h2'), { textContent: 'How the title has swung' }));
  p.append(Object.assign(el('p', 'sub'), { textContent:
    'Running total after each race for the top six. Gross points — drop scores are not applied.' }));
  p.append(chart());
}

/* -------------------------------------------------------------- chart */
function chart() {
  const box = el('div', 'chartbox');
  const top = scoring.slice(0, 6);
  const rounds = D.roundsRun;
  const series = top.map((t, i) => {
    let run = 0;
    const pts = rounds.map(r => {
      const s = t.rounds[String(r)]; run += s ? s.total : 0; return { r, v: run };
    });
    return { name: t.driver, short: t.driver.split(' ').slice(-1)[0], no: t.no,
             colour: `var(${SERIES[i]})`, pts, end: run };
  });
  const maxY = Math.ceil(Math.max(...series.map(s => s.end)) / 50) * 50;

  const W = 980, H = 340, M = { t: 12, r: 108, b: 30, l: 42 };
  const x = i => M.l + (W - M.l - M.r) * (i / (rounds.length - 1));
  const y = v => H - M.b - (H - M.t - M.b) * (v / maxY);

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative championship points by race">`;
  for (let g = 0; g <= maxY; g += 50)
    s += `<line class="gl" x1="${M.l}" y1="${y(g)}" x2="${W - M.r}" y2="${y(g)}"/>`
       + `<text class="ax" x="${M.l - 8}" y="${y(g) + 3.5}" text-anchor="end">${g}</text>`;
  // event bands along the foot
  D.events.filter(e => e.source).forEach(e => {
    const idx = e.rounds.map(r => rounds.indexOf(r)).filter(i => i >= 0);
    if (!idx.length) return;
    const mid = (x(idx[0]) + x(idx[idx.length - 1])) / 2;
    s += `<text class="ax" x="${mid}" y="${H - 8}" text-anchor="middle">${esc(e.name.split(' ')[0])}</text>`;
  });
  rounds.forEach((r, i) =>
    s += `<text class="ax" x="${x(i)}" y="${H - M.b + 13}" text-anchor="middle">${r}</text>`);

  series.forEach(se => {
    const d = se.pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${se.colour}" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>`;
    const lx = x(rounds.length - 1), ly = y(se.end);
    s += `<circle cx="${lx}" cy="${ly}" r="4" fill="${se.colour}" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<text class="serieslab" x="${lx + 9}" y="${ly + 4}" fill="${se.colour}">${esc(se.short)} ${se.end}</text>`;
  });
  s += `<line id="cross" x1="0" y1="${M.t}" x2="0" y2="${H - M.b}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  s += `<rect id="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/>`;
  s += '</svg>';
  box.innerHTML = s;

  const svg = box.querySelector('svg'), cross = box.querySelector('#cross');
  box.querySelector('#hit').addEventListener('mousemove', ev => {
    const bb = svg.getBoundingClientRect();
    const px = (ev.clientX - bb.left) / bb.width * W;
    let i = Math.round((px - M.l) / (W - M.l - M.r) * (rounds.length - 1));
    i = Math.max(0, Math.min(rounds.length - 1, i));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', .8);
    const rd = rounds[i], race = raceOf[rd];
    const rows = series.map(se => `<i class="dot" style="background:${se.colour}"></i> `
      + `${esc(se.short)} <b>${se.pts[i].v}</b>`).join('<br>');
    showTip(`<b>Round ${rd}</b> — ${esc(race.eventName)}<br>${rows}`, ev.clientX, ev.clientY);
  });
  box.querySelector('#hit').addEventListener('mouseleave', () => {
    cross.setAttribute('opacity', 0); hideTip();
  });

  const lg = el('div', 'chart-legend');
  lg.innerHTML = series.map(se =>
    `<span><i class="dot" style="background:${se.colour}"></i>${esc(se.name)} <span class="mono"
      style="color:var(--ink-3)">#${se.no}</span></span>`).join('');
  box.append(lg);
  return box;
}

/* ------------------------------------------------------------- run-in */
const REMAINING = D.roundsTotal - D.roundsRun.length;
const MAX_RACE = 26;                       // 25 for a win + 1 for the fastest lap

/** Season total after the three drop scores (reg 1.6.4). */
function netTotal(scores) {
  const low = [...scores].sort((a, b) => a - b).slice(0, D.dropScores);
  return scores.reduce((a, b) => a + b, 0) - low.reduce((a, b) => a + b, 0);
}
/**
 * Projected final total, with `v` scored in each round still to run.
 * Only round scores (race points plus the fastest lap point) can be dropped;
 * a reg 4.2.3 penalty comes off the championship total, so it is added back
 * after the drop rather than being discarded with a bad round.
 */
function project(t, v) {
  const s = [];
  for (let r = 1; r <= D.roundsTotal; r++) {
    if (runSet.has(r)) { const x = t.rounds[String(r)]; s.push(x ? x.score : 0); }
    else s.push(v);
  }
  return netTotal(s) + t.penalty_points;
}
function quantile(arr, q) {
  const s = [...arr].sort((a, b) => a - b);
  const p = (s.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p);
  return s[lo] + (s[hi] - s[lo]) * (p - lo);
}

function runInModel() {
  return scoring.map(t => {
    // form band is about race pace, so it uses the round score rather than the
    // penalty-adjusted total
    const entered = D.roundsRun.map(r => t.rounds[String(r)])
      .filter(Boolean).map(x => x.score);
    const q1 = Math.round(quantile(entered, .25));
    const q3 = Math.round(quantile(entered, .75));
    const med = Math.round(quantile(entered, .5));
    return {
      t, entered,
      floor: project(t, 0),             // scores nothing in the remaining races
      ceiling: project(t, MAX_RACE),    // wins every remaining race with fastest lap
      bodyLo: project(t, q1), bodyHi: project(t, q3), mid: project(t, med),
      formLo: q1, formHi: q3, formMid: med,
    };
  });
}

function runin() {
  const p = $('#p-runin'); p.innerHTML = '';
  if (REMAINING === 0) {
    p.innerHTML = '<p class="lede">Every round has been run — the championship table is final.</p>';
    return;
  }
  const m = runInModel();
  const bestFloor = Math.max(...m.map(d => d.floor));
  m.forEach(d => { d.live = d.ceiling >= bestFloor; });
  const live = m.filter(d => d.live);

  p.append(Object.assign(el('p', 'lede'), { textContent:
    `${REMAINING} races left, worth a theoretical maximum of ${REMAINING * MAX_RACE} points. `
    + `Each candle is one driver's possible finishing total once the three drop scores are `
    + `applied — so points banked now are not all bankable at the end.` }));

  const kpi = el('div', 'kpis');
  kpi.innerHTML = [
    ['Races remaining', REMAINING,
     D.events.filter(e => !e.source).map(e => e.name).join(' and ')],
    ['Maximum still available', REMAINING * MAX_RACE, `${REMAINING} × 25 for a win + 1 fastest lap`],
    ['Title floor to beat', bestFloor,
     `${esc(m.find(d => d.floor === bestFloor).t.driver)} cannot finish below this`],
    ['Still in contention', live.length, `of ${m.length} registered drivers`],
  ].map(([k, v, n]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>`
    + `<div class="n">${n}</div></div>`).join('');
  p.append(kpi);

  p.append(Object.assign(el('h2'), { textContent: 'Best and worst case, after drop scores' }));
  p.append(Object.assign(el('p', 'sub'), { textContent:
    'Wick: score nothing more (bottom) to win every remaining race with the fastest lap (top). '
    + 'Body: the driver’s own form band — their 25th to 75th percentile race score so far, '
    + 'repeated across the races left. The bar across the body is that form band’s midpoint.' }));
  p.append(candles(m, bestFloor));

  const lg = el('div', 'legend');
  lg.innerHTML =
    '<span><i class="sw" style="background:var(--flag-ink);border-color:var(--flag-ink)"></i>Championship leader</span>'
    + '<span><i class="sw" style="background:var(--s1);border-color:var(--s1)"></i>Can still win the title</span>'
    + '<span><i class="sw" style="background:var(--ink-3);border-color:var(--ink-3)"></i>Mathematically out</span>'
    + '<span><i class="sw" style="background:transparent;border-style:dashed"></i>Dashed line: title floor to beat</span>';
  p.append(lg);

  const det = el('details', 'tv');
  det.innerHTML = '<summary>Show the same figures as a table</summary>';
  const sc = el('div', 'scroller'), tb = el('table');
  tb.innerHTML = '<thead><tr><th>Pos</th><th>Driver</th><th class="num">Now (gross)</th>'
    + '<th class="num">Worst finish</th><th class="num">Form band</th><th class="num">Best finish</th>'
    + '<th class="num">Form score</th><th>Title</th></tr></thead><tbody>'
    + m.map(d => `<tr class="${d.live ? '' : 'outrow'}"><td class="num mono">${d.t.pos}</td>`
      + `<td>${esc(d.t.driver)}</td><td class="num mono">${d.t.gross}</td>`
      + `<td class="num mono">${d.floor}</td>`
      + `<td class="num mono">${d.bodyLo}–${d.bodyHi}</td>`
      + `<td class="num mono">${d.ceiling}</td>`
      + `<td class="num mono">${d.formLo}–${d.formHi}</td>`
      + `<td>${d.live ? 'In contention' : 'Out'}</td></tr>`).join('')
    + '</tbody>';
  sc.append(tb); det.append(sc); p.append(det);

  p.append(Object.assign(el('p', 'sub'), { textContent:
    'Only one driver can take the win and the fastest lap in any race, so the top of every wick '
    + 'is a ceiling no two drivers can reach together. Championship penalties already applied are '
    + 'baked in; future ones obviously are not.' }));
}

function candles(m, bestFloor) {
  const box = el('div', 'candlebox');
  const SLOT = 46, PAD = { t: 14, r: 16, b: 58, l: 46 };
  const W = PAD.l + m.length * SLOT + PAD.r, H = 400;
  const vals = m.flatMap(d => [d.floor, d.ceiling]);
  const lo = Math.floor(Math.min(...vals, 0) / 50) * 50;
  const hi = Math.ceil(Math.max(...vals) / 50) * 50;
  const y = v => PAD.t + (H - PAD.t - PAD.b) * (1 - (v - lo) / (hi - lo));
  const cx = i => PAD.l + SLOT * i + SLOT / 2;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Best and worst possible final points total for each driver">`;
  for (let g = lo; g <= hi; g += 50)
    s += `<line class="gl" x1="${PAD.l - 6}" y1="${y(g)}" x2="${W - PAD.r}" y2="${y(g)}"/>`
       + `<text class="ax" x="${PAD.l - 12}" y="${y(g) + 3.5}" text-anchor="end">${g}</text>`;
  s += `<line class="refline" x1="${PAD.l - 6}" y1="${y(bestFloor)}" x2="${W - PAD.r}" y2="${y(bestFloor)}"/>`
     + `<text class="reftext" x="${W - PAD.r}" y="${y(bestFloor) - 5}" text-anchor="end">`
     + `title floor ${bestFloor}</text>`;

  m.forEach((d, i) => {
    const c = !d.live ? 'var(--ink-3)' : (d.t.pos === 1 ? 'var(--flag-ink)' : 'var(--s1)');
    const x = cx(i), bw = 20;
    const top = Math.min(y(d.bodyHi), y(d.bodyLo)), h = Math.max(2, Math.abs(y(d.bodyHi) - y(d.bodyLo)));
    const tipText = `<b>${esc(d.t.driver)}</b> — P${d.t.pos}, ${d.t.gross} pts<br>`
      + `Best possible finish <b>${d.ceiling}</b><br>`
      + `Form band <b>${d.bodyLo}–${d.bodyHi}</b> (scoring ${d.formLo}–${d.formHi} a race)<br>`
      + `Worst possible finish <b>${d.floor}</b><br>`
      + (d.live ? 'Can still win the title' : 'Mathematically out of the title race');
    s += `<g data-tip="${tipText.replace(/"/g, '&quot;')}">`
       + `<rect x="${x - SLOT / 2}" y="${PAD.t}" width="${SLOT}" height="${H - PAD.t - PAD.b}" fill="transparent"/>`
       + `<line x1="${x}" y1="${y(d.ceiling)}" x2="${x}" y2="${y(d.floor)}" stroke="${c}" stroke-width="1.5"/>`
       + `<line x1="${x - 5}" y1="${y(d.ceiling)}" x2="${x + 5}" y2="${y(d.ceiling)}" stroke="${c}" stroke-width="1.5"/>`
       + `<line x1="${x - 5}" y1="${y(d.floor)}" x2="${x + 5}" y2="${y(d.floor)}" stroke="${c}" stroke-width="1.5"/>`
       + `<rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="1.5"
            fill="${c}" fill-opacity=".22" stroke="${c}" stroke-width="1.5"/>`
       + `<line x1="${x - bw / 2}" y1="${y(d.mid)}" x2="${x + bw / 2}" y2="${y(d.mid)}"
            stroke="${c}" stroke-width="2.5"/>`
       + `<text class="xlab${d.live ? '' : ' out'}" x="${x}" y="${H - PAD.b + 14}"
            text-anchor="end" transform="rotate(-45 ${x} ${H - PAD.b + 14})">`
       + `${esc(d.t.driver.split(' ').slice(-1)[0])}</text>`
       + `</g>`;
  });
  s += '</svg>';
  box.innerHTML = s;
  return box;
}

    <h3>Guest entries</h3>
    <p>Only drivers registered for the full year score. Anyone entering on a round-by-round basis is
    <em>invisible for the allocation of points</em> <span class="reg">1.3.5</span>, so a driver who
    finishes behind a guest still takes the higher score.</p>
    <h3>Drop scores</h3>
    <p>The three lowest round scores are discarded from the season total
    <span class="reg">1.6.4</span>. A round score is race points plus the fastest lap point, and a
    round a driver did not contest counts as a zero and is a candidate for dropping.
    A championship penalty is <em>not</em> part of a round score - reg 4.2.3 takes it off the
    championship total - so it cannot be discarded by dropping the round it came from.
    With ${D.roundsTotal - D.roundsRun.length} races still to run the <em>Net</em> column is
    indicative; the order shown follows the gross total, as the official leaderboard does.</p>
    <h3>Penalties</h3>
    <p>A penalty that carries Motorsport UK licence points also costs three times that number of
    championship points <span class="reg">4.2.3</span>, deducted from the championship total rather
    than from that round, so a drop score cannot wipe it out. Overseas rounds use notional licence
    points one step below the equivalent domestic penalty.</p>
    <h3>Shortened races</h3>
    <p>If the Clerk of the Course cuts a race short: 60% or more of the intended time scores full
    points, 25–60% scores half, below 25% scores nothing <span class="reg">1.6.4</span>.</p>`;

  const right = el('div');
  right.innerHTML = '<h3 class="disp" style="margin:0 0 8px;font-size:18px;text-transform:uppercase;'
    + 'letter-spacing:.04em">Points scale in force</h3>';
  const sc = el('div', 'scroller'), tb = el('table');
  const rows = [];
  for (let n = 1; n <= 24; n++) rows.push([n, n === 1 ? 25 : (n <= 23 ? 25 - n : 1)]);
  tb.innerHTML = '<thead><tr><th>Finishing place (points-scoring cars)</th>'
    + '<th class="num">Points</th></tr></thead><tbody>'
    + rows.map(([n, v]) => `<tr><td>${n === 24 ? '24th and every other classified finisher'
      : n + ordinal(n)}</td><td class="num mono">${v}</td></tr>`).join('')
    + `<tr><td>Fastest lap of the race</td><td class="num mono">+1</td></tr></tbody>`;
  sc.append(tb); right.append(sc);

  const pen = el('div');
  pen.innerHTML = '<h3 class="disp" style="margin:26px 0 8px;font-size:18px;text-transform:uppercase;'
    + 'letter-spacing:.04em">Deductions applied this season</h3>'
    + `<p class="sub">Three times the licence points for the offence <span class="reg">4.2.3</span>,`
    + ` taken off the championship total.</p>`;
  const psc = el('div', 'scroller'), ptb = el('table');
  ptb.innerHTML = '<thead><tr><th class="num">Rd</th><th>Driver</th><th class="num">Licence pts</th>'
    + '<th class="num">Deduction</th><th>Decision</th></tr></thead><tbody>'
    + D.penalties.map(p => `<tr><td class="num mono">${p.round}</td><td>${esc(p.driver)}</td>`
      + `<td class="num mono">${p.licence_points}</td>`
      + `<td class="num mono" style="color:var(--alarm)">−${p.deduction}</td>`
      + `<td><a href="${esc(p.source)}">sheet</a>${p.provisional ? ' <span class="chip">provisional</span>' : ''}</td></tr>`)
      .join('') + '</tbody>';
  psc.append(ptb); pen.append(psc); right.append(pen);

  wrapEl.append(left, right); p.append(wrapEl);
  linkRegs(p);
}
const ordinal = n => (n % 100 >= 11 && n % 100 <= 13) ? 'th'
  : ['th', 'st', 'nd', 'rd'][n % 10] || 'th';

standings(); races(); runin(); calendar(); rules();
</script>
